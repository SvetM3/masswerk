<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Rounded dark background tile -->
  <rect width="512" height="512" rx="112" fill="#111111" />
  <!-- Tilted ruler icon in the other direction -->
  <g transform="translate(256, 256) rotate(45) translate(-256, -256)">
    <!-- Ruler body -->
    <rect x="136" y="196" width="240" height="120" rx="24" fill="none" stroke="#ffffff" stroke-width="28" stroke-linejoin="round" />
    <!-- Ruler tick marks -->
    <line x1="200" y1="196" x2="200" y2="232" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    <line x1="256" y1="196" x2="256" y2="248" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    <line x1="312" y1="196" x2="312" y2="232" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
  </g>
</svg>
